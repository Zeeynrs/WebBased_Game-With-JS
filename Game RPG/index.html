            align-items: center;

            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            color: #fff;
            user-select: none;
            overflow: hidden;
        }

        .game-wrapper {
            display: flex;

            align-items: center;

        }

        canvas {

        }

        .controls-hint {
            margin-top: 14px;

            color: #a0aec0;
        }

        .controls-hint kbd {
            background: #2d3748;
            color: #f7fafc;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            box-shadow: 0 2px 0 #1a202c;
            border: 1px solid #4a5568;
        }

        .key-group {
            display: flex;
            align-items: center;
            gap: 6px;

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        // --- WEB AUDIO API SYNTHESIZER ---
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                if (type === 'slash') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.12);
                } else if (type === 'hit') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.1);
                } else if (type === 'explode') {
                    const bufferSize = audioCtx.sampleRate * 0.25;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const filter = audioCtx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(800, now);
                    filter.frequency.exponentialRampToValueAtTime(80, now + 0.25);
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                    noise.start(now);
                } else if (type === 'coin') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(987.77, now);
                    osc.frequency.setValueAtTime(1318.51, now + 0.06);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.18);
                } else if (type === 'heal') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.22);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.22);
                } else if (type === 'shield') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.linearRampToValueAtTime(1200, now + 0.18);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.2);
                } else if (type === 'teleport') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(1400, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                        gain.gain.setValueAtTime(0.2, now + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.08 + 0.25);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.08); osc.stop(now + idx * 0.08 + 0.25);
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

                    gameState = 'PLAYING';

        // Wall Collision Detector
        function checkWallCollision(x, y, w, h) {
            if (x < 16 || x + w > canvas.width - 16 || y < 64 || y + h > canvas.height - 16) {
                return true;
            }

            if (!dungeonGate.open) {
                if (x + w > dungeonGate.x && x < dungeonGate.x + dungeonGate.w &&
                    y + h > dungeonGate.y && y < dungeonGate.y + dungeonGate.h) {
                    return true;
                }
            }

            for (const wall of walls) {
                if (x < wall.x + wall.w && x + w > wall.x &&
                    y < wall.y + wall.h && y + h > wall.y) {
                    return true;
                }
            }
            return false;
        }

        function loadStage(stageNum) {
            currentStage = stageNum;
            mobs = [];
            walls = [];
            torches = [];
            coins.length = 0;
            loots.length = 0;
            particles.length = 0;
            smokeParticles.length = 0;
            floatingTexts.length = 0;
            enemyProjectiles.length = 0;

            player.x = 40;
            player.y = canvas.height / 2 - player.h / 2;
            player.invulnerableTimer = 0;
            player.isAttacking = false;

            dungeonGate.open = false;
            dungeonGate.swirlTimer = 0;

            const configIndex = Math.min(stageNum - 1, STAGE_CONFIGS.length - 1);
            const config = STAGE_CONFIGS[configIndex];

            if (config.walls) walls = [...config.walls];
            if (config.torches) torches = [...config.torches];

            if (torches.length === 0) {
                torches = [{ x: 100, y: 64 }, { x: 320, y: 64 }, { x: 540, y: 64 }, { x: 18, y: 200 }, { x: 622, y: 200 }];
            }

            if (config.loots) {
                config.loots.forEach(l => {
                    loots.push({ x: l.x, y: l.y, type: l.type, floatTimer: Math.random() * Math.PI * 2 });
                });
            }

            if (stageNum > STAGE_CONFIGS.length) {
                const count = 4 + Math.floor(stageNum * 1.5);
                const speciesList = ['slime', 'zombie', 'skeleton', 'dragon'];
                const slimeColors = ['#2ecc71', '#3498db', '#9b59b6'];
                for (let i = 0; i < count; i++) {
                    const isBoss = (i === 0 && stageNum % 3 === 0);
                    const chosenSpecies = speciesList[Math.floor(Math.random() * speciesList.length)];
                    let chosenColor = '#2ecc71';
                    if (chosenSpecies === 'zombie') chosenColor = '#2d6a4f';
                    else if (chosenSpecies === 'skeleton') chosenColor = '#f8fafc';
                    else if (chosenSpecies === 'dragon') chosenColor = '#dc2626';
                    else chosenColor = slimeColors[Math.floor(Math.random() * slimeColors.length)];

                    if (isBoss) chosenColor = chosenSpecies === 'dragon' ? '#dc2626' : '#9b59b6';

                    mobs.push({
                        id: i + 1,
                        x: 280 + Math.random() * 240,
                        y: 80 + Math.random() * 220,
                        w: isBoss ? 56 : (chosenSpecies === 'dragon' ? 52 : (chosenSpecies === 'zombie' ? 24 : (chosenSpecies === 'skeleton' ? 22 : 20))),
                        h: isBoss ? 56 : (chosenSpecies === 'dragon' ? 52 : (chosenSpecies === 'zombie' ? 28 : (chosenSpecies === 'skeleton' ? 26 : 20))),
                        hp: isBoss ? 300 + stageNum * 60 : 70 + stageNum * 18,
                        maxHp: isBoss ? 300 + stageNum * 60 : 70 + stageNum * 18,
                        speed: isBoss ? 0.85 : (chosenSpecies === 'skeleton' ? 1.2 : (chosenSpecies === 'zombie' ? 0.8 : 0.9 + Math.random() * 0.4)),
                        color: chosenColor,
                        type: isBoss ? 'boss' : 'normal',
                        species: chosenSpecies,
                        level: isBoss ? `Lv.${stageNum} BOSS 👑` : `Lv.${stageNum}`
                    });
                }
            } else {
                config.mobs.forEach((m, idx) => {
                    const species = m.species || 'slime';
                    let lvlLabel = `Lv.${stageNum}`;
                    if (m.type === 'boss') {
                        if (stageNum === 10) lvlLabel = 'Lv.10 SLIME KING 👑';
                        else if (stageNum === 15) lvlLabel = 'Lv.15 ZOMBIE WARLORD 🧟';
                        else if (stageNum === 20) lvlLabel = 'Lv.20 SKELETON KING 💀👑';
                        else if (stageNum === 21) lvlLabel = 'Lv.21 ANCIENT DRAGON 🐲👑';
                        else lvlLabel = `Lv.${stageNum} BOSS 👑`;
                    } else if (m.w && m.w > 25) {
                        lvlLabel = `Lv.${stageNum} MINI-BOSS`;
                    }

                    let mobColor = m.color;
                    if (!mobColor) {
                        if (species === 'zombie') mobColor = '#2d6a4f';
                        else if (species === 'skeleton') mobColor = '#f8fafc';
                        else if (species === 'dragon') mobColor = '#dc2626';
                        else mobColor = '#2ecc71';
                    }

                    mobs.push({
                        id: idx + 1,
                        x: m.x, y: m.y,
                        w: m.w || (species === 'dragon' ? 64 : (species === 'zombie' ? 24 : (species === 'skeleton' ? 22 : 20))),
                        h: m.h || (species === 'dragon' ? 64 : (species === 'zombie' ? 28 : (species === 'skeleton' ? 26 : 20))),
                        hp: m.hp, maxHp: m.hp,
                        speed: m.speed, color: mobColor,
                        type: m.type || 'normal',
                        species: species,
                        level: lvlLabel
                    });
                });
            }
        }

        function startGame() {
            score = 0;
            coinsCollected = 0;
            player.hp = player.maxHp;
            player.shield = player.maxShield;
            loadStage(1);
            gameState = 'PLAYING';
        }

        function resetGame(stageNum = 1) {
            if (stageNum === 1) {
                score = 0;
                coinsCollected = 0;
                player.hp = player.maxHp;
                player.shield = player.maxShield;
            }
            loadStage(stageNum);
            gameState = 'PLAYING';
        }

        function nextStage() {
            playSound('teleport');
            teleportFlashTimer = 25;
            loadStage(currentStage + 1);
            gameState = 'PLAYING';
        }

        function isHovering(x, y, w, h) {
            return mouseX >= x && mouseX <= x + w && mouseY >= y && mouseY <= y + h;
        }

        function handleCanvasClick() {
            // Sound Mute Toggle Button
            if (isHovering(canvas.width - 34, 8, 28, 24)) {
                soundEnabled = !soundEnabled;
                return;
            }

            // Pause Toggle Button on HUD
            if (isHovering(canvas.width - 64, 8, 28, 24)) {
                if (gameState === 'PLAYING') gameState = 'PAUSED';
                else if (gameState === 'PAUSED') gameState = 'PLAYING';
                return;
            }

            if (gameState === 'MENU') {
                if (isHovering(canvas.width / 2 - 90, 210, 180, 48)) startGame();
            } else if (gameState === 'PAUSED') {
                // Button 1: RESUME PLAY [ESC]
                if (isHovering(canvas.width / 2 - 110, 180, 220, 42)) {
                    gameState = 'PLAYING';
                }
                // Button 2: RESTART STAGE [R]
                else if (isHovering(canvas.width / 2 - 110, 236, 220, 42)) {
                    resetGame(currentStage);
                }
                // Button 3: EXIT TO MAIN MENU [QUIT]
                else if (isHovering(canvas.width / 2 - 110, 292, 220, 42)) {
                    gameState = 'MENU';
                }
            } else if (gameState === 'GAMEOVER') {
                if (isHovering(canvas.width / 2 - 90, 230, 180, 44)) resetGame(1);
            }
        }

        function createSlimeExplosion(x, y, color, isBoss = false, species = 'slime') {
            playSound('explode');
            screenShake = isBoss ? 12 : 6;

            const particleCount = isBoss ? 45 : 22;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * (isBoss ? 5.5 : 3.8) + 1.0;
                let particleColor = color;
                if (species === 'zombie') particleColor = Math.random() > 0.4 ? '#2d6a4f' : '#ef4444';
                else if (species === 'skeleton') particleColor = Math.random() > 0.4 ? '#f8fafc' : '#94a3b8';
                else particleColor = Math.random() > 0.3 ? color : '#ffffff';

                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * (isBoss ? 6 : 4) + 2,
                    color: particleColor,
                    life: Math.floor(Math.random() * 20) + 15,
                    maxLife: 35
                });
            }

            const coinCount = isBoss ? Math.floor(Math.random() * 6) + 10 : Math.floor(Math.random() * 3) + 3;
            for (let i = 0; i < coinCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const ejectSpeed = Math.random() * 3 + 1.5;
                coins.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * ejectSpeed,
                    vy: Math.sin(angle) * ejectSpeed,
                    z: 0,
                    vz: Math.random() * 4 + 3,
                    rotation: Math.random() * Math.PI * 2,
                    value: 50,
                    bounced: 0
                });
            }

            if (Math.random() < 0.45) {
                const lootType = Math.random() < 0.6 ? 'health' : 'shield';
                loots.push({ x: x, y: y, type: lootType, floatTimer: 0 });
            }
        }

        function getFacingAngle(facing) {
            if (facing === 'right') return 0;
            if (facing === 'down') return Math.PI / 2;
            if (facing === 'left') return Math.PI;
            if (facing === 'up') return -Math.PI / 2;
            return 0;
        }

        // --- UPDATE LOOP ---
        function update() {
            if (screenShake > 0) screenShake *= 0.85;
            if (teleportFlashTimer > 0) teleportFlashTimer--;

            if (gameState !== 'PLAYING') return;

            if (player.shieldHitFlashTimer > 0) player.shieldHitFlashTimer--;

            if (player.shieldRechargeTimer > 0) {
                player.shieldRechargeTimer--;
            } else if (player.shield < player.maxShield) {
                player.shield = Math.min(player.maxShield, player.shield + 0.12);
            }

            torches.forEach(t => {
                if (Math.random() < 0.35) {
                    smokeParticles.push({
                        x: t.x + (Math.random() - 0.5) * 4,
                        y: t.y - 6,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: -0.7 - Math.random() * 0.4,
                        size: 3 + Math.random() * 3.5,
                        life: 32,
                        maxLife: 32
                    });
                }
            });

            let moveDx = 0;
            let moveDy = 0;
            if (keys['w'] || keys['arrowup']) { moveDy -= 1; player.facing = 'up'; }
            if (keys['s'] || keys['arrowdown']) { moveDy += 1; player.facing = 'down'; }
            if (keys['a'] || keys['arrowleft']) { moveDx -= 1; player.facing = 'left'; }
            if (keys['d'] || keys['arrowright']) { moveDx += 1; player.facing = 'right'; }

            if (moveDx !== 0 && moveDy !== 0) {
                moveDx *= 0.7071;
                moveDy *= 0.7071;
            }

            const stepSpeed = player.isAttacking ? player.speed * 0.45 : player.speed;
            const nextX = player.x + moveDx * stepSpeed;
            const nextY = player.y + moveDy * stepSpeed;

            if (!checkWallCollision(nextX, player.y, player.w, player.h)) {
                player.x = nextX;
            }
            if (!checkWallCollision(player.x, nextY, player.w, player.h)) {
                player.y = nextY;
            }

            if (player.attackCooldown > 0) player.attackCooldown--;
            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            if ((keys['j'] || keys[' ']) && player.attackCooldown === 0 && !player.isAttacking) {
                player.isAttacking = true;
                player.attackTime = 0;
                player.attackCooldown = 20;
                player.hitMobsThisSwing.clear();
                playSound('slash');
            }

            if (player.isAttacking) {
                player.attackTime++;
                player.slashArcProgress = player.attackTime / player.attackDuration;

                const baseAngle = getFacingAngle(player.facing);
                const sweepSpan = Math.PI * 0.75;
                const currentAngle = baseAngle - sweepSpan / 2 + sweepSpan * player.slashArcProgress;
                const arcRadius = 40;

                const px = player.x + player.w / 2;
                const py = player.y + player.h / 2;

                const sparkX = px + Math.cos(currentAngle) * (arcRadius - 2 + Math.random() * 4);
                const sparkY = py + Math.sin(currentAngle) * (arcRadius - 2 + Math.random() * 4);
                particles.push({
                    x: sparkX, y: sparkY,
                    vx: (Math.random() - 0.5) * 0.8,
                    vy: (Math.random() - 0.5) * 0.8,
                    size: Math.random() * 2.5 + 1.5,
                    color: Math.random() > 0.3 ? '#fff' : '#f1c40f',
                    life: 12
                });

                mobs.forEach(mob => {
                    if (player.hitMobsThisSwing.has(mob.id)) return;

                    const mx = mob.x + mob.w / 2;
                    const my = mob.y + mob.h / 2;
                    const dist = Math.hypot(mx - px, my - py);

                    if (dist <= arcRadius + mob.w / 2) {
                        let angleToMob = Math.atan2(my - py, mx - px);
                        let diffAngle = angleToMob - baseAngle;

                        while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
                        while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;

                        if (Math.abs(diffAngle) < sweepSpan / 1.6) {
                            player.hitMobsThisSwing.add(mob.id);
                            const dmg = Math.floor(Math.random() * 8) + 22;
                            mob.hp -= dmg;
                            playSound('hit');

                            const kx = mob.x + Math.cos(angleToMob) * 14;
                            const ky = mob.y + Math.sin(angleToMob) * 14;
                            if (!checkWallCollision(kx, mob.y, mob.w, mob.h)) mob.x = kx;
                            if (!checkWallCollision(mob.x, ky, mob.w, mob.h)) mob.y = ky;

                            floatingTexts.push({
                                x: mob.x + mob.w / 2, y: mob.y - 8,
                                text: dmg, color: '#ffeb3b', life: 26
                            });

                            for (let i = 0; i < 5; i++) {
                                particles.push({
                                    x: mob.x + mob.w / 2, y: mob.y + mob.h / 2,
                                    vx: (Math.random() - 0.5) * 3.5, vy: (Math.random() - 0.5) * 3.5,
                                    size: 3, color: '#fff59d', life: 14
                                });
                            }
                        }
                    }
                });

                if (player.attackTime >= player.attackDuration) {
                    player.isAttacking = false;
                }
            }

            for (let i = mobs.length - 1; i >= 0; i--) {
                const mob = mobs[i];

                if (mob.hp <= 0) {
                    createSlimeExplosion(mob.x + mob.w / 2, mob.y + mob.h / 2, mob.color, mob.type === 'boss', mob.species);
                    score += (mob.type === 'boss' ? 500 : 100);
                    mobs.splice(i, 1);
                    continue;
                }

                mob.hopTimer = (mob.hopTimer || Math.random() * Math.PI * 2) + 0.14 * (mob.speed || 1);

                const px = player.x + player.w / 2;
                const py = player.y + player.h / 2;
                const mx = mob.x + mob.w / 2;
                const my = mob.y + mob.h / 2;

                const dist = Math.hypot(px - mx, py - my);
                if (dist < 260 && dist > 12) {
                    const stepMobX = mob.x + ((px - mx) / dist) * mob.speed;
                    const stepMobY = mob.y + ((py - my) / dist) * mob.speed;

                    if (!checkWallCollision(stepMobX, mob.y, mob.w, mob.h)) mob.x = stepMobX;
                    if (!checkWallCollision(mob.x, stepMobY, mob.w, mob.h)) mob.y = stepMobY;
                }

                // Skeleton Bow Ranged Shooting AI
                if (mob.species === 'skeleton') {
                    mob.shootTimer = (mob.shootTimer || Math.floor(Math.random() * 40)) + 1;
                    const shootInterval = mob.type === 'boss' ? 70 : 105;
                    if (mob.shootTimer >= shootInterval && dist < 280) {
                        mob.shootTimer = 0;
                        const angle = Math.atan2(py - my, px - mx);
                        const arrowSpeed = 4.2;
                        enemyProjectiles.push({
                            x: mx,
                            y: my,
                            vx: Math.cos(angle) * arrowSpeed,
                            vy: Math.sin(angle) * arrowSpeed,
                            angle: angle,
                            type: 'arrow',
                            dmg: mob.type === 'boss' ? 22 : 12,
                            life: 110
                        });
                        playSound('slash');
                    }
                }

                // Dragon Boss AI (Far Fire Breath Cone vs Close Fiery Claw Slash)
                if (mob.species === 'dragon') {
                    mob.dragonTimer = (mob.dragonTimer || 0) + 1;
                    mob.clawTimer = Math.max(0, (mob.clawTimer || 0) - 1);

                    if (dist >= 70 && dist < 320) {
                        // Far Range: Fireball Breath Cone
                        if (mob.dragonTimer >= 65) {
                            mob.dragonTimer = 0;
                            const angle = Math.atan2(py - my, px - mx);
                            const speed = 4.8;

                            for (let f = -1; f <= 1; f++) {
                                const spreadAngle = angle + f * 0.22;
                                enemyProjectiles.push({
                                    x: mx,
                                    y: my - 16,
                                    vx: Math.cos(spreadAngle) * speed,
                                    vy: Math.sin(spreadAngle) * speed,
                                    angle: spreadAngle,
                                    type: 'fireball',
                                    dmg: mob.type === 'boss' ? 24 : 16,
                                    life: 90
                                });
                            }
                            playSound('explode');
                        }
                    } else if (dist < 70) {
                        // Close Range: Melee Fiery Claw Slash
                        if (mob.dragonTimer >= 40) {
                            mob.dragonTimer = 0;
                            mob.clawTimer = 18;

                            if (player.invulnerableTimer === 0) {
                                let clawDmg = 30;
                                player.invulnerableTimer = 35;
                                player.shieldRechargeTimer = 240;
                                screenShake = 12;

                                if (player.shield > 0) {
                                    const absorbed = Math.min(player.shield, clawDmg);
                                    player.shield -= absorbed;
                                    clawDmg -= absorbed;
                                    player.shieldHitFlashTimer = 16;
                                    floatingTexts.push({
                                        x: player.x + player.w / 2, y: player.y - 18,
                                        text: `-${absorbed} 🛡️`, color: '#00e5ff', life: 28
                                    });
                                    playSound('shield');
                                }

                                if (clawDmg > 0) {
                                    player.hp -= clawDmg;
                                    playSound('hit');
                                    floatingTexts.push({
                                        x: player.x + player.w / 2, y: player.y - 8,
                                        text: `-${clawDmg} HP 🐾`, color: '#ff1744', life: 30
                                    });

                                    if (player.hp <= 0) {
                                        player.hp = 0;
                                        gameState = 'GAMEOVER';
                                    }
                                }
                            }
                        }
                    }
                }

                if (dist < 16 && player.invulnerableTimer === 0) {
                    let mobDmg = mob.type === 'boss' ? 24 : 14;
                    player.invulnerableTimer = 35;
                    player.shieldRechargeTimer = 240;
                    screenShake = 8;

                    if (player.shield > 0) {
                        const absorbed = Math.min(player.shield, mobDmg);
                        player.shield -= absorbed;
                        mobDmg -= absorbed;

                        player.shieldHitFlashTimer = 16;

                        floatingTexts.push({
                            x: player.x + player.w / 2, y: player.y - 18,
                            text: `-${absorbed} 🛡️`, color: '#00e5ff', life: 28
                        });
                        playSound('shield');

                        for (let s = 0; s < 8; s++) {
                            particles.push({
                                x: player.x + player.w / 2, y: player.y + player.h / 2,
                                vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
                                size: 3, color: '#00e5ff', life: 14
                            });
                        }
                    }

                    if (mobDmg > 0) {
                        player.hp -= mobDmg;
                        playSound('hit');
                        floatingTexts.push({
                            x: player.x + player.w / 2, y: player.y - 8,
                            text: `-${mobDmg} HP`, color: '#ff4d4d', life: 28
                        });

                        if (player.hp <= 0) {
                            player.hp = 0;
                            gameState = 'GAMEOVER';
                        }
                    }
                }
            }

            // FLYING ENEMY ARROWS UPDATE LOOP
            for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
                const arr = enemyProjectiles[i];
                arr.x += arr.vx;
                arr.y += arr.vy;
                arr.life--;

                if (checkWallCollision(arr.x - 3, arr.y - 3, 6, 6) || arr.life <= 0) {
                    for (let p = 0; p < 4; p++) {
                        particles.push({
                            x: arr.x, y: arr.y,
                            vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                            size: 2, color: '#b45309', life: 10
                        });
                    }
                    enemyProjectiles.splice(i, 1);
                    continue;
                }

                const px = player.x + player.w / 2;
                const py = player.y + player.h / 2;
                const distToPlayer = Math.hypot(px - arr.x, py - arr.y);

                if (distToPlayer < 14 && player.invulnerableTimer === 0) {
                    let dmg = arr.dmg;
                    player.invulnerableTimer = 30;
                    player.shieldRechargeTimer = 240;
                    screenShake = 6;

                    if (player.shield > 0) {
                        const absorbed = Math.min(player.shield, dmg);
                        player.shield -= absorbed;
                        dmg -= absorbed;
                        player.shieldHitFlashTimer = 16;
                        floatingTexts.push({
                            x: player.x + player.w / 2, y: player.y - 18,
                            text: `-${absorbed} 🛡️`, color: '#00e5ff', life: 28
                        });
                        playSound('shield');
                        for (let s = 0; s < 6; s++) {
                            particles.push({
                                x: player.x + player.w / 2, y: player.y + player.h / 2,
                                vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4,
                                size: 3, color: '#00e5ff', life: 12
                            });
                        }
                    }

                    if (dmg > 0) {
                        player.hp -= dmg;
                        playSound('hit');
                        floatingTexts.push({
                            x: player.x + player.w / 2, y: player.y - 8,
                            text: `-${dmg} HP 🏹`, color: '#ff4d4d', life: 28
                        });
                        if (player.hp <= 0) {
                            player.hp = 0;
                            gameState = 'GAMEOVER';
                        }
                    }

                    enemyProjectiles.splice(i, 1);
                }
            }

            if (mobs.length === 0) {
                if (!dungeonGate.open) {
                    dungeonGate.open = true;
                    playSound('victory');
                    floatingTexts.push({
                        x: dungeonGate.x + 20,
                        y: dungeonGate.y - 14,
                        text: 'GERBANG TERBUKA! 🌀',
                        color: '#2ecc71',
                        life: 60
                    });
                }

                dungeonGate.swirlTimer += 0.1;

                const px = player.x + player.w / 2;
                const py = player.y + player.h / 2;
                const gx = dungeonGate.x + dungeonGate.w / 2;
                const gy = dungeonGate.y + dungeonGate.h / 2;

                if (Math.hypot(px - gx, py - gy) < 26) {
                    nextStage();
                }
            }

            const px = player.x + player.w / 2;
            const py = player.y + player.h / 2;

            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                c.x += c.vx; c.y += c.vy;
                c.vx *= 0.92; c.vy *= 0.92;

                c.z += c.vz; c.vz -= 0.45;
                if (c.z <= 0) {
                    c.z = 0;
                    if (c.bounced < 2) { c.vz = -c.vz * 0.45; c.bounced++; }
                    else { c.vz = 0; }
                }

                const distToPlayer = Math.hypot(px - c.x, py - c.y);
                if (distToPlayer < 75) {
                    c.x += ((px - c.x) / distToPlayer) * 4.2;
                    c.y += ((py - c.y) / distToPlayer) * 4.2;
                }

                if (distToPlayer < 18) {
                    coinsCollected++;
                    score += c.value;
                    playSound('coin');

                    floatingTexts.push({
                        x: c.x, y: c.y - 6,
                        text: `+1 🪙 (+${c.value})`, color: '#f1c40f', life: 24
                    });

                    for (let p = 0; p < 4; p++) {
                        particles.push({
                            x: c.x, y: c.y,
                            vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                            size: 2, color: '#ffe135', life: 10
                        });
                    }
                    coins.splice(i, 1);
                }
            }

            for (let i = loots.length - 1; i >= 0; i--) {
                const l = loots[i];
                l.floatTimer += 0.08;

                const distToPlayer = Math.hypot(px - l.x, py - l.y);
                if (distToPlayer < 75) {
                    l.x += ((px - l.x) / distToPlayer) * 3.8;
                    l.y += ((py - l.y) / distToPlayer) * 3.8;
                }

                if (distToPlayer < 20) {
                    if (l.type === 'health') {
                        const healAmount = 35;
                        player.hp = Math.min(player.maxHp, player.hp + healAmount);
                        playSound('heal');
                        floatingTexts.push({
                            x: l.x, y: l.y - 8,
                            text: `+${healAmount} HP ❤️`, color: '#2ecc71', life: 30
                        });
                    } else if (l.type === 'shield') {
                        const shieldAmount = 30;
                        player.shield = Math.min(player.maxShield, player.shield + shieldAmount);
                        playSound('shield');
                        floatingTexts.push({
                            x: l.x, y: l.y - 8,
                            text: `+${shieldAmount} ARMOR 🛡️`, color: '#00e5ff', life: 30
                        });
                    }

                    for (let p = 0; p < 8; p++) {
                        particles.push({
                            x: l.x, y: l.y,
                            vx: (Math.random() - 0.5) * 3, vy: (Math.random() - 0.5) * 3,
                            size: 3, color: l.type === 'health' ? '#2ecc71' : '#00e5ff', life: 15
                        });
                    }

                    loots.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = smokeParticles.length - 1; i >= 0; i--) {
                const sm = smokeParticles[i];
                sm.x += sm.vx; sm.y += sm.vy;
                sm.size += 0.04;
                sm.life--;
                if (sm.life <= 0) smokeParticles.splice(i, 1);
            }

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y -= 0.6;
                ft.life--;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }
        }

        // --- DRAW FUNCTIONS ---

        function drawDungeonFloor() {
            // Dark cavern floor background base
            ctx.fillStyle = '#0a0d14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const playTop = 46;

            // 1. Organic Cave Stone Floor Tiles (Rough 48x48 stone slabs with cracks and pebbles)
            const tileSize = 48;
            for (let x = 0; x < canvas.width; x += tileSize) {
                for (let y = playTop; y < canvas.height; y += tileSize) {
                    const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
                    ctx.fillStyle = isAlt ? '#0f1420' : '#0c101a';
                    ctx.fillRect(x, y, tileSize, tileSize);

                    // Cracked stone slab borders
                    ctx.strokeStyle = '#161d2d';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(x + 1, y + 1, tileSize - 2, tileSize - 2);

                    // Pixel stone details & crack accents
                    ctx.fillStyle = '#1c263b';
                    ctx.fillRect(x + 8, y + 12, 3, 2);
                    ctx.fillRect(x + 32, y + 28, 2, 2);
                    ctx.fillRect(x + 20, y + 38, 3, 3);
                    ctx.fillStyle = '#080a10';
                    ctx.fillRect(x + 11, y + 14, 2, 1);
                    ctx.fillRect(x + 23, y + 41, 1, 2);
                }
            }

            // 2. CAVERN OUTER ROCK WALL BOUNDARIES
            // Top Cave Wall (under HUD, y: 46 to 64)
            ctx.fillStyle = '#161d2a';
            ctx.fillRect(0, playTop, canvas.width, 18);
            ctx.fillStyle = '#2a364d';
            ctx.fillRect(0, playTop, canvas.width, 3);

            // Stalactite/Jagged Stone Edges along top cave border
            ctx.fillStyle = '#101622';
            for (let x = 0; x < canvas.width; x += 16) {
                const teethH = 4 + (x % 7);
                ctx.fillRect(x, playTop + 18, 12, teethH);
                ctx.fillStyle = '#222d40';
                ctx.fillRect(x, playTop + 18, 12, 1);
                ctx.fillStyle = '#101622';
            }

            // Left and Right Cavern Rock Walls (w: 16px)
            ctx.fillStyle = '#161d2a';
            ctx.fillRect(0, playTop, 16, canvas.height - playTop);
            ctx.fillRect(canvas.width - 16, playTop, 16, canvas.height - playTop);

            // Jagged side rock protrusions
            ctx.fillStyle = '#253147';
            for (let y = playTop; y < canvas.height; y += 24) {
                ctx.fillRect(14, y + 4, 4, 12);
                ctx.fillRect(canvas.width - 18, y + 10, 4, 12);
            }

            // Bottom Cavern Rock Wall (h: 16px)
            ctx.fillStyle = '#161d2a';
            ctx.fillRect(0, canvas.height - 16, canvas.width, 16);
            ctx.fillStyle = '#253147';
            ctx.fillRect(0, canvas.height - 16, canvas.width, 3);

            // 3. CAVERN MAZE ROCK WALLS (3D Layered Pixel Cavern Rocks)
            walls.forEach(w => {
                // Shadow cast under wall
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(w.x + 4, w.y + w.h, w.w - 4, 6);

                // Base Rock Body (Front face)
                ctx.fillStyle = '#1c2536';
                ctx.fillRect(w.x, w.y, w.w, w.h);

                // Top Rock Surface Cap (Lighted top edge for 3D depth)
                const capH = Math.min(10, w.h / 2);
                ctx.fillStyle = '#334361';
                ctx.fillRect(w.x, w.y, w.w, capH);

                // Brightest Top Rock Edge Highlight
                ctx.fillStyle = '#4c618a';
                ctx.fillRect(w.x, w.y, w.w, 2);

                // Front Face Brick / Rock Texture Lines
                ctx.fillStyle = '#111724';
                ctx.fillRect(w.x, w.y + capH, w.w, 2);

                // Vertical Stone Joint Cracks
                for (let bx = w.x + 16; bx < w.x + w.w; bx += 32) {
                    ctx.fillRect(bx, w.y, 2, capH);
                    ctx.fillRect(bx - 8, w.y + capH, 2, w.h - capH);
                }

                // Horizontal Rock Layer Dividers
                for (let by = w.y + capH + 16; by < w.y + w.h; by += 16) {
                    ctx.fillRect(w.x, by, w.w, 2);
                }

                // Jagged Rock Outer Stroke
                ctx.strokeStyle = '#0b0f19';
                ctx.lineWidth = 2;
                ctx.strokeRect(w.x, w.y, w.w, w.h);
            });
        }

        function drawTorchesAndSmoke() {
            // 1. Warm Ambient Torch Glow Circles on Cave Floor
            torches.forEach(t => {
                ctx.save();
                const glowGrad = ctx.createRadialGradient(t.x, t.y, 2, t.x, t.y, 55);
                glowGrad.addColorStop(0, 'rgba(255, 120, 0, 0.22)');
                glowGrad.addColorStop(0.5, 'rgba(255, 80, 0, 0.08)');
                glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = glowGrad;
                ctx.beginPath();
                ctx.arc(t.x, t.y, 55, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // 2. Rising Smoke Particles
            smokeParticles.forEach(sm => {
                const opacity = (sm.life / sm.maxLife) * 0.45;
                ctx.fillStyle = `rgba(160, 175, 200, ${opacity})`;
                ctx.beginPath();
                ctx.arc(sm.x, sm.y, sm.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // 3. Wall Torches & Animated Flickering Flames
            torches.forEach(t => {
                // Iron Wall Bracket Plate
                ctx.fillStyle = '#2d3748';
                ctx.fillRect(t.x - 5, t.y + 2, 10, 6);
                ctx.fillStyle = '#1a202c';
                ctx.fillRect(t.x - 3, t.y + 3, 6, 4);

                // Torch Wooden Stick Handle
                ctx.fillStyle = '#6e4726';
                ctx.fillRect(t.x - 2, t.y - 4, 4, 12);
                ctx.fillStyle = '#4a2e16';
                ctx.fillRect(t.x, t.y - 4, 2, 12);

                // Iron Metal Cup holding the fire
                ctx.fillStyle = '#3a4a63';
                ctx.fillRect(t.x - 4, t.y - 7, 8, 4);

                // Multi-layer Burning Flame Animation
                ctx.save();
                ctx.shadowColor = '#ff6d00';
                ctx.shadowBlur = 14;

                const flickerX = (Math.random() - 0.5) * 1.5;
                const flameSize = 6 + Math.random() * 3;

                // Outer Red Flame
                ctx.fillStyle = '#ff3d00';
                ctx.beginPath();
                ctx.arc(t.x + flickerX, t.y - 11, flameSize, 0, Math.PI * 2);
                ctx.fill();

                // Middle Orange/Yellow Flame
                ctx.fillStyle = '#ffc107';
                ctx.beginPath();
                ctx.arc(t.x + flickerX, t.y - 12, flameSize * 0.65, 0, Math.PI * 2);
                ctx.fill();

                // Inner White Core Flame
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(t.x + flickerX * 0.5, t.y - 13, flameSize * 0.35, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawDungeonGate() {
            ctx.save();

            const gx = dungeonGate.x + dungeonGate.w / 2;
            const gy = dungeonGate.y + dungeonGate.h / 2;

            // Outer Stone Arch Frame
            ctx.fillStyle = '#1c2638';
            ctx.fillRect(dungeonGate.x - 4, dungeonGate.y - 4, dungeonGate.w + 8, dungeonGate.h + 8);

            // Stone Arch Highlights
            ctx.fillStyle = '#3a4b6e';
            ctx.fillRect(dungeonGate.x - 4, dungeonGate.y - 4, dungeonGate.w + 8, 4);
            ctx.fillRect(dungeonGate.x - 4, dungeonGate.y - 4, 4, dungeonGate.h + 8);
            ctx.fillRect(dungeonGate.x + dungeonGate.w, dungeonGate.y - 4, 4, dungeonGate.h + 8);

            // Arch Keystone at top
            ctx.fillStyle = '#526691';
            ctx.fillRect(gx - 6, dungeonGate.y - 6, 12, 6);
            ctx.strokeStyle = '#101622';
            ctx.lineWidth = 1;
            ctx.strokeRect(gx - 6, dungeonGate.y - 6, 12, 6);

            if (dungeonGate.open) {
                // OPEN GATEWAY: Double doors folded wide open, glowing portal active inside!
                ctx.shadowColor = '#00e5ff';
                ctx.shadowBlur = 18;

                // Dark Portal Cavity
                ctx.fillStyle = '#060a14';
                ctx.fillRect(dungeonGate.x, dungeonGate.y, dungeonGate.w, dungeonGate.h);

                // Folded Left & Right Double Door Panels
                ctx.fillStyle = '#3d2516';
                ctx.fillRect(dungeonGate.x - 3, dungeonGate.y, 6, dungeonGate.h);
                ctx.fillRect(dungeonGate.x + dungeonGate.w - 3, dungeonGate.y, 6, dungeonGate.h);
                ctx.fillStyle = '#1e120a';
                ctx.fillRect(dungeonGate.x + 1, dungeonGate.y, 2, dungeonGate.h);
                ctx.fillRect(dungeonGate.x + dungeonGate.w - 3, dungeonGate.y, 2, dungeonGate.h);

                // Swirling Portal Energy Vortex
                ctx.strokeStyle = '#00e5ff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(gx, gy, 15, dungeonGate.swirlTimer, dungeonGate.swirlTimer + Math.PI * 1.5);
                ctx.stroke();

                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(gx, gy, 9, -dungeonGate.swirlTimer * 1.3, -dungeonGate.swirlTimer * 1.3 + Math.PI * 1.5);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(gx, gy, 4 + Math.sin(dungeonGate.swirlTimer * 2) * 1.5, 0, Math.PI * 2);
                ctx.fill();

                for (let i = 0; i < 4; i++) {
                    const angle = dungeonGate.swirlTimer + i * 1.57;
                    const px = gx + Math.cos(angle) * 13;
                    const py = gy + Math.sin(angle) * 13;
                    ctx.fillStyle = '#00e5ff';
                    ctx.fillRect(px, py, 2.5, 2.5);
                }

                ctx.fillStyle = '#2ecc71';
                ctx.font = '8px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('PORTAL 🌀', gx, dungeonGate.y - 9);
                ctx.textAlign = 'left';

            } else {
                // LOCKED DOUBLE ENTRANCE DOORS (Gerbang Pintu Masuk Ganda)
                const halfW = dungeonGate.w / 2;

                // Left Wood Door Panel
                ctx.fillStyle = '#5c3d2e';
                ctx.fillRect(dungeonGate.x, dungeonGate.y, halfW - 1, dungeonGate.h);

                // Right Wood Door Panel
                ctx.fillStyle = '#4a2e1b';
                ctx.fillRect(dungeonGate.x + halfW + 1, dungeonGate.y, halfW - 1, dungeonGate.h);

                // Vertical Wood Plank Texture Lines
                ctx.fillStyle = '#29190e';
                ctx.fillRect(dungeonGate.x + 6, dungeonGate.y, 1.5, dungeonGate.h);
                ctx.fillRect(dungeonGate.x + 13, dungeonGate.y, 1.5, dungeonGate.h);
                ctx.fillRect(dungeonGate.x + halfW + 7, dungeonGate.y, 1.5, dungeonGate.h);
                ctx.fillRect(dungeonGate.x + halfW + 14, dungeonGate.y, 1.5, dungeonGate.h);

                // Center Seam Gap between Double Doors
                ctx.fillStyle = '#110a05';
                ctx.fillRect(dungeonGate.x + halfW - 1, dungeonGate.y, 2, dungeonGate.h);

                // Heavy Iron Reinforcement Strips & Hinges
                ctx.fillStyle = '#2d3748';
                ctx.fillRect(dungeonGate.x, dungeonGate.y + 10, dungeonGate.w, 4);
                ctx.fillRect(dungeonGate.x, dungeonGate.y + dungeonGate.h - 14, dungeonGate.w, 4);

                // Iron Rivets on Door Bands
                ctx.fillStyle = '#a0aec0';
                ctx.fillRect(dungeonGate.x + 3, dungeonGate.y + 11, 2, 2);
                ctx.fillRect(dungeonGate.x + dungeonGate.w - 5, dungeonGate.y + 11, 2, 2);
                ctx.fillRect(dungeonGate.x + 3, dungeonGate.y + dungeonGate.h - 13, 2, 2);
                ctx.fillRect(dungeonGate.x + dungeonGate.w - 5, dungeonGate.y + dungeonGate.h - 13, 2, 2);

                // Double Door Ring Handles
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.arc(dungeonGate.x + halfW - 4, gy + 4, 3.5, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(dungeonGate.x + halfW + 4, gy + 4, 3.5, 0, Math.PI * 2); ctx.stroke();

                // HEAVY CENTER LOCK SHIELD EMBLEM
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.moveTo(gx, gy - 10);
                ctx.lineTo(gx + 8, gy - 6);
                ctx.lineTo(gx + 8, gy + 2);
                ctx.quadraticCurveTo(gx, gy + 9, gx, gy + 11);
                ctx.quadraticCurveTo(gx, gy + 9, gx - 8, gy + 2);
                ctx.lineTo(gx - 8, gy - 6);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#f1c40f';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Keyhole
                ctx.fillStyle = '#111827';
                ctx.beginPath();
                ctx.arc(gx, gy - 2, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillRect(gx - 1.5, gy - 2, 3, 5);

                // Status Label
                ctx.fillStyle = '#ff4d4d';
                ctx.font = '7px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('TERKUNCI 🔒', gx, dungeonGate.y - 9);
                ctx.textAlign = 'left';
            }

            ctx.restore();
        }

        function drawSlashArc(px, py) {
            if (!player.isAttacking) return;

            const baseAngle = getFacingAngle(player.facing);
            const sweepSpan = Math.PI * 0.75;
            const startAngle = baseAngle - sweepSpan / 2;
            const currentAngle = startAngle + sweepSpan * player.slashArcProgress;
            const radius = 38;

            ctx.save();
            ctx.beginPath();
            ctx.arc(px, py, radius, startAngle, currentAngle, false);
            ctx.lineWidth = 10;
            ctx.strokeStyle = '#f1c40f';
            ctx.lineCap = 'round';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(px, py, radius, startAngle + (currentAngle - startAngle) * 0.25, currentAngle, false);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ffffff';
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
        }

        function drawSword(px, py) {
            ctx.save();
            ctx.translate(px, py);

            const baseAngle = getFacingAngle(player.facing);
            let swordAngle = baseAngle;

            if (player.isAttacking) {
                const sweepSpan = Math.PI * 0.75;
                swordAngle = baseAngle - sweepSpan / 2 + sweepSpan * player.slashArcProgress;
            } else {
                swordAngle = baseAngle + 0.35;
            }

            ctx.rotate(swordAngle);

            const swordLength = player.isAttacking ? 34 : 26;
            
            // Ruby Gem Pommel
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath(); ctx.arc(2, 0, 3, 0, Math.PI * 2); ctx.fill();

            // Leather Wrap Grip
            ctx.fillStyle = '#78350f'; ctx.fillRect(4, -2.5, 5, 5);

            // Gold Crossguard
            ctx.fillStyle = '#fbbf24'; ctx.fillRect(8, -6, 4, 12);
            ctx.fillStyle = '#f59e0b'; ctx.fillRect(10, -6, 2, 12);

            // Steel Blade Base & Highlight
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = player.isAttacking ? 12 : 4;
            ctx.fillStyle = '#f8fafc'; ctx.fillRect(12, -3.5, swordLength - 12, 7);
            ctx.fillStyle = '#94a3b8'; ctx.fillRect(12, 0, swordLength - 12, 3.5);

            // Blade Tip
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(swordLength, -3.5);
            ctx.lineTo(swordLength + 5, 0);
            ctx.lineTo(swordLength, 3.5);
            ctx.closePath();
            ctx.fill();

            // Blade Center Line
            ctx.fillStyle = '#cbd5e1'; ctx.fillRect(12, -0.6, swordLength - 10, 1.2);

            ctx.restore();
        }

        function drawPlayerModel(px, py) {
            const time = Date.now() * 0.006;
            const capeWave = Math.sin(time) * 3.5;

            ctx.save();

            // 1. DYNAMIC ANIMATED HERO CAPE (Flowing Crimson Hero Cape)
            ctx.fillStyle = '#991b1b';
            ctx.beginPath();
            if (player.facing === 'down') {
                ctx.moveTo(player.x + 3, player.y + 10);
                ctx.quadraticCurveTo(player.x - 4 + capeWave, player.y + player.h + 6, player.x + 4, player.y + player.h + 8);
                ctx.lineTo(player.x + player.w - 4, player.y + player.h + 8);
                ctx.quadraticCurveTo(player.x + player.w + 4 - capeWave, player.y + player.h + 6, player.x + player.w - 3, player.y + 10);
            } else if (player.facing === 'up') {
                ctx.moveTo(player.x + 1, player.y + 6);
                ctx.quadraticCurveTo(player.x - 8 + capeWave, player.y + player.h + 7, player.x - 2, player.y + player.h + 9);
                ctx.lineTo(player.x + player.w + 2, player.y + player.h + 9);
                ctx.quadraticCurveTo(player.x + player.w + 8 - capeWave, player.y + player.h + 7, player.x + player.w - 1, player.y + 6);
            } else if (player.facing === 'right') {
                ctx.moveTo(player.x + 4, player.y + 6);
                ctx.quadraticCurveTo(player.x - 12 + capeWave, player.y + player.h / 2, player.x - 8 + capeWave * 0.5, player.y + player.h + 6);
                ctx.lineTo(player.x + 6, player.y + player.h + 3);
            } else { // left
                ctx.moveTo(player.x + player.w - 4, player.y + 6);
                ctx.quadraticCurveTo(player.x + player.w + 12 - capeWave, player.y + player.h / 2, player.x + player.w + 8 - capeWave * 0.5, player.y + player.h + 6);
                ctx.lineTo(player.x + player.w - 6, player.y + player.h + 3);
            }
            ctx.closePath();
            ctx.fill();

            // Inner Cape Accent
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            if (player.facing === 'right' || player.facing === 'left') {
                ctx.ellipse(player.x + player.w / 2, player.y + player.h, 6, 3, 0, 0, Math.PI * 2);
            }
            ctx.fill();

            // 2. STEEL GREAVES & BOOTS
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(player.x + 3, player.y + player.h - 6, 6, 6);
            ctx.fillRect(player.x + player.w - 9, player.y + player.h - 6, 6, 6);
            ctx.fillStyle = '#475569';
            ctx.fillRect(player.x + 4, player.y + player.h - 6, 4, 3);
            ctx.fillRect(player.x + player.w - 8, player.y + player.h - 6, 4, 3);

            // 3. STEEL BREASTPLATE & GOLD TRIM (Chest Armor)
            ctx.fillStyle = '#334155'; // Dark Steel Base Body
            ctx.fillRect(player.x + 2, player.y + 8, player.w - 4, player.h - 14);

            // Polished Steel Chest Plate
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(player.x + 4, player.y + 9, player.w - 8, player.h - 16);
            ctx.fillStyle = '#e2e8f0'; // Metallic Highlight
            ctx.fillRect(player.x + 5, player.y + 9, 3, player.h - 16);

            // Gold Crest Trim on Chest
            ctx.fillStyle = '#fbbf24';
            ctx.fillRect(player.x + player.w / 2 - 2, player.y + 11, 4, 6);
            ctx.fillRect(player.x + player.w / 2 - 4, player.y + 13, 8, 2);

            // 4. METALLIC SHOULDER PAULDRONS
            ctx.fillStyle = '#64748b';
            ctx.fillRect(player.x - 2, player.y + 7, 5, 7);
            ctx.fillRect(player.x + player.w - 3, player.y + 7, 5, 7);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(player.x - 2, player.y + 7, 5, 2);
            ctx.fillRect(player.x + player.w - 3, player.y + 7, 5, 2);

            // 5. HEATER SHIELD (Mounted on Left Arm / Back)
            const showShieldOnBody = player.facing !== 'right';
            if (showShieldOnBody) {
                const sx = player.facing === 'left' ? player.x + 10 : player.x - 5;
                const sy = player.y + 9;

                // Shield Body
                ctx.fillStyle = '#1e3a8a';
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(sx + 10, sy);
                ctx.lineTo(sx + 10, sy + 10);
                ctx.quadraticCurveTo(sx + 5, sy + 16, sx + 5, sy + 17);
                ctx.quadraticCurveTo(sx + 5, sy + 16, sx, sy + 10);
                ctx.closePath();
                ctx.fill();

                // Gold Border & Cross Emblem
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#fbbf24';
                ctx.fillRect(sx + 4, sy + 3, 2, 8);
                ctx.fillRect(sx + 2, sy + 5, 6, 2);
            }

            // 6. KNIGHT HELMET WITH GLOWING VISOR & FEATHER PLUME
            const headY = player.y - 3;
            // Plume / Feather on Top of Helmet
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.ellipse(player.x + player.w / 2, headY - 3, 3, 6, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#f87171';
            ctx.beginPath();
            ctx.ellipse(player.x + player.w / 2 - 1, headY - 4, 1.5, 4, -0.3, 0, Math.PI * 2);
            ctx.fill();

            // Helmet Steel Dome
            ctx.fillStyle = '#475569';
            ctx.fillRect(player.x + 2, headY, player.w - 4, 12);
            ctx.fillStyle = '#cbd5e1'; // Metallic Highlight Top
            ctx.fillRect(player.x + 3, headY, player.w - 6, 3);

            // Dark Visor Slit
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(player.x + 3, headY + 5, player.w - 6, 4);

            // Glowing Hero Cyan Eyes inside Visor
            ctx.fillStyle = '#00e5ff';
            ctx.shadowColor = '#00e5ff';
            ctx.shadowBlur = 8;
            if (player.facing === 'right') {
                ctx.fillRect(player.x + 10, headY + 6, 4, 2);
            } else if (player.facing === 'left') {
                ctx.fillRect(player.x + 4, headY + 6, 4, 2);
            } else if (player.facing === 'down') {
                ctx.fillRect(player.x + 5, headY + 6, 3, 2);
                ctx.fillRect(player.x + 10, headY + 6, 3, 2);
            } else { // up
                ctx.fillStyle = '#334155'; // Back of helmet
                ctx.fillRect(player.x + 3, headY + 4, player.w - 6, 7);
            }

            ctx.restore();
        }

        function drawCoins() {
            coins.forEach(c => {
                const drawY = c.y - c.z;
                ctx.save();
                ctx.translate(c.x, drawY);

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(0, c.z, 6, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#f1c40f';
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#d4ac0d';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#fff59d';
                ctx.fillRect(-2, -2, 4, 4);

                ctx.restore();
            });
        }

        function drawLoots() {
            loots.forEach(l => {
                const floatOffset = Math.sin(l.floatTimer) * 4;
                ctx.save();
                ctx.translate(l.x, l.y + floatOffset);

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(0, 9 - floatOffset, 8, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();

                if (l.type === 'health') {
                    ctx.shadowColor = '#ff1744';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#ff1744';
                    ctx.beginPath();
                    ctx.moveTo(0, 6);
                    ctx.bezierCurveTo(-9, -2, -9, -11, 0, -4);
                    ctx.bezierCurveTo(9, -11, 9, -2, 0, 6);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(-3, -6, 2, 2);
                } else if (l.type === 'shield') {
                    ctx.shadowColor = '#00e5ff';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = '#00e5ff';
                    ctx.beginPath();
                    ctx.moveTo(-8, -8);
                    ctx.lineTo(8, -8);
                    ctx.lineTo(8, -1);
                    ctx.quadraticCurveTo(8, 9, 0, 13);
                    ctx.quadraticCurveTo(-8, 9, -8, -1);
                    ctx.closePath();
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();

                    ctx.fillStyle = '#ffea00';
                    ctx.fillRect(-2, -5, 4, 11);
                    ctx.fillRect(-6, -2, 12, 4);
                }

                ctx.restore();
            });
        }

        function drawTopHUD() {

            ctx.fillRect(0, 0, canvas.width, 46);
            ctx.fillStyle = '#2b354a';
            ctx.fillRect(0, 44, canvas.width, 2);

            ctx.fillRect(10, 6, 125, 14);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(10, 6, 125, 14);

            const hpRatio = Math.max(0, player.hp / player.maxHp);
            const hpGradient = ctx.createLinearGradient(12, 0, 133, 0);
            hpGradient.addColorStop(0, '#e74c3c');
            hpGradient.addColorStop(1, '#2ecc71');
            ctx.fillStyle = hpGradient;
            ctx.fillRect(12, 8, 121 * hpRatio, 10);

            ctx.fillRect(10, 24, 125, 14);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(10, 24, 125, 14);

            const shieldRatio = Math.max(0, player.shield / player.maxShield);

            shieldGradient.addColorStop(1, '#00e5ff');
            ctx.fillStyle = shieldGradient;
            ctx.fillRect(12, 26, 121 * shieldRatio, 10);

            ctx.fillStyle = '#ffffff';
            ctx.font = '8px "Press Start 2P", monospace';

            // 3. STAGE TITLE BADGE (Center, x: 142, y: 8, w: 220, h: 28)

            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 1.5;

            ctx.fillStyle = '#f1c40f';
            ctx.font = '8px "Press Start 2P", monospace';

            // 4. COINS & SCORE DISPLAY (Middle-Right, x: 370)

            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillText(`🪙 ${coinsCollected}`, 370, 18);

            ctx.fillStyle = '#ffffff';
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillText(`SCORE:${score.toString().padStart(5, '0')}`, 370, 35);

            // 5. PAUSE BUTTON (Far Right, x: canvas.width - 64, y: 9, w: 26, h: 26)
            const pauseBtnX = canvas.width - 64;
            const pauseBtnY = 9;
            ctx.fillStyle = isHovering(pauseBtnX, pauseBtnY, 26, 26) ? '#3a4760' : '#1e2636';
            ctx.fillRect(pauseBtnX, pauseBtnY, 26, 26);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(pauseBtnX, pauseBtnY, 26, 26);
            ctx.font = '12px sans-serif';
            ctx.fillText(gameState === 'PAUSED' ? '▶️' : '⏸️', pauseBtnX + 5, pauseBtnY + 18);

            // 6. AUDIO SOUND MUTE BUTTON (Far Right, x: canvas.width - 34, y: 9, w: 26, h: 26)
            const btnX = canvas.width - 34;
            const btnY = 9;
            ctx.fillStyle = isHovering(btnX, btnY, 26, 26) ? '#3a4760' : '#1e2636';
            ctx.fillRect(btnX, btnY, 26, 26);
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(btnX, btnY, 26, 26);
            ctx.font = '12px sans-serif';
            ctx.fillText(soundEnabled ? '🔊' : '🔇', btnX + 4, btnY + 18);
        }

        function drawZombieMob(mob, cx, cy, groundY) {
            const time = Date.now() * 0.008 + mob.id;
            const wobble = Math.sin(time) * 2.5;

            ctx.save();
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(cx, groundY - 2, mob.w * 0.5, 4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Legs
            ctx.fillStyle = '#1b263b';
            ctx.fillRect(cx - 6, cy + 4, 5, 10);
            ctx.fillRect(cx + 1, cy + 4, 5, 10);

            // Body / Tattered Shirt
            ctx.fillStyle = '#3a5a40';
            ctx.fillRect(cx - 8 + wobble * 0.5, cy - 8, 16, 13);
            ctx.fillStyle = '#1e2923';
            ctx.fillRect(cx - 4 + wobble * 0.5, cy - 3, 4, 4);

            // Outstretched Rotting Zombie Arms
            ctx.fillStyle = '#2d6a4f';
            ctx.fillRect(cx - 14 + wobble, cy - 4, 8, 4);
            ctx.fillRect(cx + 6 + wobble, cy - 4, 8, 4);

            // Head
            const headY = cy - 18;
            ctx.fillStyle = '#40916c';
            ctx.fillRect(cx - 7, headY, 14, 11);

            ctx.fillStyle = '#1b4332';
            ctx.fillRect(cx - 7, headY, 14, 3);

            // Eyes with Red Pupils
            ctx.fillStyle = '#081c15';
            ctx.fillRect(cx - 5, headY + 4, 4, 3);
            ctx.fillRect(cx + 1, headY + 4, 4, 3);
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(cx - 4, headY + 5, 2, 1.5);
            ctx.fillRect(cx + 2, headY + 5, 2, 1.5);

            // Mouth
            ctx.fillStyle = '#081c15';
            ctx.fillRect(cx - 3, headY + 8, 6, 2);
            ctx.fillStyle = '#74c69d';
            ctx.fillRect(cx - 1, headY + 9, 2, 3);

            if (mob.type === 'boss') {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(cx - 8, headY - 5, 16, 4);
            }

            ctx.restore();
        }

        function drawSkeletonMob(mob, cx, cy, groundY) {
            const time = Date.now() * 0.01 + mob.id;
            const rattle = Math.sin(time * 2) * 1.5;

            ctx.save();
            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(cx, groundY - 2, mob.w * 0.5, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Bone Legs
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(cx - 5, cy + 5, 3, 9);
            ctx.fillRect(cx + 2, cy + 5, 3, 9);

            // Spine & Ribcage
            ctx.fillStyle = '#94a3b8';
            ctx.fillRect(cx - 1, cy - 6, 2, 11);

            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(cx - 6 + rattle * 0.3, cy - 6, 12, 2);
            ctx.fillRect(cx - 5 + rattle * 0.3, cy - 3, 10, 2);
            ctx.fillRect(cx - 4 + rattle * 0.3, cy, 8, 2);

            // Bony Arms holding Wooden Bow
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(cx - 9 + rattle, cy - 4, 5, 3);
            ctx.fillRect(cx + 4 + rattle, cy - 4, 5, 3);

            // WOODEN BOW 🏹 (Curved Stave & String)
            const bowX = cx + 8 + rattle;
            const bowY = cy - 2;

            ctx.strokeStyle = '#d97706';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(bowX, bowY, 11, -Math.PI * 0.45, Math.PI * 0.45);
            ctx.stroke();

            // Taut Bowstring
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(bowX + Math.cos(-Math.PI * 0.45) * 11, bowY + Math.sin(-Math.PI * 0.45) * 11);
            ctx.lineTo(bowX - 3, bowY);
            ctx.lineTo(bowX + Math.cos(Math.PI * 0.45) * 11, bowY + Math.sin(Math.PI * 0.45) * 11);
            ctx.stroke();

            // Nocked Arrow Ready on Bowstring
            ctx.fillStyle = '#78350f';
            ctx.fillRect(bowX - 6, bowY - 1, 14, 2);
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.moveTo(bowX + 11, bowY);
            ctx.lineTo(bowX + 7, bowY - 3);
            ctx.lineTo(bowX + 7, bowY + 3);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(bowX - 7, bowY - 2, 3, 4);

            // Skull Head
            const headY = cy - 17;
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(cx - 6, headY, 12, 10);

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(cx - 5, headY + 3, 4, 3);
            ctx.fillRect(cx + 1, headY + 3, 4, 3);
            ctx.fillRect(cx - 1, headY + 6, 2, 2);

            ctx.fillStyle = '#64748b';
            ctx.fillRect(cx - 4, headY + 8, 8, 1.5);

            if (mob.type === 'boss') {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(cx - 7, headY - 5, 14, 4);
                ctx.fillRect(cx - 7, headY - 8, 4, 3);
                ctx.fillRect(cx - 1, headY - 10, 3, 5);
                ctx.fillRect(cx + 3, headY - 8, 4, 3);
            }

            ctx.restore();
        }

        function drawDragonMob(mob, cx, cy, groundY) {
            const time = Date.now() * 0.006 + mob.id;
            const flyZ = 16 + Math.sin(time * 3) * 8;
            const wingFlap = Math.sin(time * 6) * 0.35;

            const drawY = cy - flyZ;

            ctx.save();

            // 1. Dynamic Ground Shadow under Flying Dragon
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.beginPath();
            ctx.ellipse(cx, groundY - 2, mob.w * 0.55 * (1 - flyZ * 0.015), 6, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. LONG SPIKY DRAGON TAIL
            ctx.strokeStyle = '#991b1b';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(cx + mob.w * 0.2, drawY + 10);
            ctx.quadraticCurveTo(cx + mob.w * 0.6 + Math.sin(time * 2) * 8, drawY + 22, cx + mob.w * 0.7, drawY + 30);
            ctx.stroke();

            // Tail Tip
            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath();
            ctx.moveTo(cx + mob.w * 0.7, drawY + 30);
            ctx.lineTo(cx + mob.w * 0.8, drawY + 26);
            ctx.lineTo(cx + mob.w * 0.75, drawY + 36);
            ctx.closePath();
            ctx.fill();

            // 3. GIANT FLAPPING CRIMSON WINGS
            ctx.save();
            ctx.translate(cx - 10, drawY - 6);
            ctx.rotate(-0.2 + wingFlap);
            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-26, -28, -42, -14);
            ctx.quadraticCurveTo(-28, 4, 0, 10);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(cx + 10, drawY - 6);
            ctx.rotate(0.2 - wingFlap);
            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(26, -28, 42, -14);
            ctx.quadraticCurveTo(28, 4, 0, 10);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // 4. MAIN SCALED DRAGON BODY
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.ellipse(cx, drawY + 4, mob.w * 0.38, mob.h * 0.32, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#7f1d1d';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Golden Chest Plates
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.ellipse(cx - 2, drawY + 7, mob.w * 0.22, mob.h * 0.22, 0, 0, Math.PI * 2);
            ctx.fill();

            // Spiked Spine Ridges
            ctx.fillStyle = '#7f1d1d';
            ctx.fillRect(cx - 3, drawY - mob.h * 0.28, 6, 8);
            ctx.fillRect(cx - 3, drawY - mob.h * 0.15, 6, 8);

            // 5. DRAGON HEAD & HORNED CROWN
            const headY = drawY - mob.h * 0.28;

            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.ellipse(cx, headY, mob.w * 0.28, mob.h * 0.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Glowing Eyes (Orange/Gold)
            ctx.fillStyle = '#fbbf24';
            ctx.shadowColor = '#fbbf24';
            ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.arc(cx - 8, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 8, headY - 3, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.fillRect(cx - 9, headY - 4, 2, 3);
            ctx.fillRect(cx + 7, headY - 4, 2, 3);

            // Nostrils & Fire Glow in Mouth
            ctx.fillStyle = '#111111';
            ctx.fillRect(cx - 4, headY + 3, 2, 2);
            ctx.fillRect(cx + 2, headY + 3, 2, 2);

            if (mob.dragonTimer && mob.dragonTimer > 40) {
                ctx.fillStyle = '#ff6d00';
                ctx.shadowColor = '#ff6d00';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(cx, headY + 5, 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dragon Horns
            ctx.fillStyle = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(cx - 10, headY - 6);
            ctx.lineTo(cx - 18, headY - 18);
            ctx.lineTo(cx - 6, headY - 8);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx + 10, headY - 6);
            ctx.lineTo(cx + 18, headY - 18);
            ctx.lineTo(cx + 6, headY - 8);
            ctx.closePath();
            ctx.fill();

            // Dragon King Horned Crown
            if (mob.type === 'boss') {
                ctx.fillStyle = '#f1c40f';
                ctx.fillRect(cx - 10, headY - 12, 20, 5);
                ctx.fillRect(cx - 10, headY - 17, 5, 5);
                ctx.fillRect(cx - 2, headY - 20, 4, 8);
                ctx.fillRect(cx + 5, headY - 17, 5, 5);
            }

            ctx.restore();

            // 6. FIERY CLAW SLASH STRIKE ANIMATION
            if (mob.clawTimer && mob.clawTimer > 0) {
                ctx.save();
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 16;
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.lineCap = 'round';

                const clawProgress = (18 - mob.clawTimer) / 18;
                const clawX = player.x + player.w / 2;
                const clawY = player.y + player.h / 2;

                for (let k = -1; k <= 1; k++) {
                    ctx.beginPath();
                    ctx.moveTo(clawX - 18 + k * 10, clawY - 20 + clawProgress * 15);
                    ctx.lineTo(clawX - 6 + k * 10, clawY + 15 + clawProgress * 15);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function drawEnemyProjectiles() {
            enemyProjectiles.forEach(arr => {
                ctx.save();
                ctx.translate(arr.x, arr.y);
                ctx.rotate(arr.angle);

                if (arr.type === 'fireball') {

                    ctx.shadowColor = '#ff6d00';
                    ctx.shadowBlur = 14;

                    ctx.fillStyle = '#ff3d00';
                    ctx.beginPath();

                    ctx.beginPath();

                    ctx.arc(0, 0, 2.5, 0, Math.PI * 2);

                    // SKELETON ARROW 🏹
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';

                    ctx.lineTo(5, -3);
                    ctx.lineTo(5, 3);
                    ctx.closePath();

                    ctx.beginPath();

                    ctx.beginPath();
                    ctx.moveTo(-10, 1);

                ctx.restore();
