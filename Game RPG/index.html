<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Slash ARPG - Slime Dungeon Labyrinth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="game-wrapper">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="640" height="384"></canvas>
        </div>
        <div class="controls-hint">
            <div class="key-group">Gerak: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>▲</kbd><kbd>◄</kbd><kbd>▼</kbd><kbd>►</kbd></div>
            <div class="key-group">Serang: <kbd>J</kbd> / <kbd>Spasi</kbd></div>
            <div class="key-group">Skill: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd></div>
            <div class="key-group">Toko: <kbd>B</kbd></div>
            <div class="key-group">Masuk Gerbang: Portal 🌀</div>
            <div class="key-group">Restart: <kbd>R</kbd></div>
        </div>
    </div>

    <!-- Game Engine Modules -->
    <script src="js/audio.js"></script>
    <script src="js/equipment.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/input.js"></script>
    <script src="js/player.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/mobs.js"></script>
    <script src="js/combat.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/draw/dungeon.js"></script>
    <script src="js/draw/mobs-render.js"></script>
    <script src="js/draw/player-render.js"></script>
    <script src="js/draw/effects.js"></script>
    <script src="js/draw/hud.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
